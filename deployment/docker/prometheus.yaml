global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: telemetrybridge
    static_configs:
      - targets: ["otel-collector:9464"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
